tagline: "The AgntUX orchestrator. Triages action items and queries your knowledge store."
description: |
  Installs first; everything else hangs off it. Maintains your `<agntux project root>/`
  knowledge store, triages action items per your `user.md` preferences,
  and keeps `_index.md` files in sync as ingest plugins write new data.
categories:
  - meta
keywords:
  - orchestrator
  - personalization
  - knowledge-store
  - triage
available_on:
  - trial
  - pro
  - team
  - enterprise
supported_prompts:
  - prompt: "/agntux"
    purpose: "One entry point for AgntUX. Sub-commands: onboard, profile, schema, teach {slug}, sync {slug}, ask {…}, feedback-review, triage-digest. Bare /agntux defaults to ask-mode."
ui_components:
  - name: "triage"
    title: "Action item triage"
    purpose: "The primary inline UI. Priority-sorted open action items with snooze / dismiss / done buttons and per-item suggested-action buttons that route into source plugins."
screenshot_order:
  - "01-chat.png"
  - "02-action-detail.png"
  - "03-personalization.png"
support:
  url: "https://github.com/AgntUX/AUX-plugins/issues?q=label%3Aagntux-core"
  email: "support@agntux.ai"
requires_plugins: []
developer:
  name: "AgntUX"
  url: "https://agntux.ai"
  github_handle: "agntux"
