tagline: "Your AgntUX home base — onboarding and your daily action-items list."
description: |
  AgntUX Core is the first thing you install — every other AgntUX plugin
  builds on it.

  Start with `/agntux onboard` to get set up. After that, `/agntux triage`
  is your everyday command: it shows your action items, sorted by what
  matters most, with one-click buttons to snooze, dismiss, or mark
  something done.

  As your other plugins bring in updates from Slack, Gmail, and your
  calendar, Core keeps everything organized and ready whenever you ask.
categories:
  - meta
keywords:
  - orchestrator
  - personalization
  - knowledge-store
  - triage
available_on:
  - trial
  - pro
  - team
  - enterprise
supported_prompts:
  - prompt: "/agntux"
    purpose: "**`/agntux onboard`** — DO THIS FIRST - and then again any time you install a new plugin. This runs your onboarding flow and gets everything set up."
  - prompt: "/agntux"
    purpose: "**`/agntux triage`** — This is your go-to command after you're onboarded. Use this to see your action items list. You'll be using this command all day every day."
  - prompt: "/agntux"
    purpose: "**`/agntux`** — Ask anything about your information, edit your profile, teach a plugin a rule, or sync a source."
ui_components:
  - name: "triage"
    title: "Action item triage"
    purpose: "Your open action items in priority order, each with snooze, dismiss, and done buttons — plus quick buttons that take you straight into the right plugin to act."
    view_tool: "agntux_core_triage_view"
    resource_uri: "ui://agntux-core/triage"
screenshot_order:
  - "01-chat.png"
  - "02-action-detail.png"
  - "03-personalization.png"
support:
  url: "https://github.com/AgntUX/AUX-plugins/issues?q=label%3Aagntux-core"
  email: "support@agntux.ai"
requires_plugins: []
developer:
  name: "AgntUX"
  url: "https://agntux.ai"
  github_handle: "agntux"
