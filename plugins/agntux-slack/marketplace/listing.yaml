tagline: "See the Slack messages that need a reply, and draft responses safely."
description: |
  Watches your DMs, @mentions, and active threads for the messages that need
  your attention — plus deadlines and decisions worth keeping. One-click
  buttons — Draft, Schedule, Open in Slack, Mark done — open a reply window
  with a ready-made draft based on what it knows about you and your earlier
  items. Reply in Slack and matching items clear themselves on the next
  check. Nothing posts to Slack until you press Send.
categories:
  - communication
  - productivity
keywords:
  - slack
  - dms
  - threads
  - mentions
  - action-items
available_on:
  - trial
  - pro
  - team
  - enterprise
data_ingested:
  - "DMs (1:1) and group DMs in your workspace"
  - "@mentions of you in any channel you have access to"
  - "Threads where you are OP or have replied"
  - "Channel messages in any channel you have authored in recently"
  - "Pinned messages and canvases referenced from monitored channels"
supported_prompts:
  - prompt: "/agntux-slack"
    purpose: "Type `/agntux-slack` to check for new messages now. Or ask a question about your Slack — that just looks things up, it doesn't change anything."
ui_components:
  - name: "compose"
    title: "Slack reply composer"
    purpose: "Write a reply right here with the thread for context. Send it now, schedule it for later, or save it as a draft."
    view_tool: "agntux_slack_compose_view"
    resource_uri: "ui://agntux-slack/compose"
  - name: "canvas"
    title: "Slack canvas summariser"
    purpose: "Turn a thread into a Slack canvas summary. Edit the title, recap, decisions, open questions, and who was involved, then post it to the thread."
    view_tool: "agntux_slack_canvas_view"
    resource_uri: "ui://agntux-slack/canvas"
screenshot_order:
  - "00-sync-status.png"
  - "01-action-detail.png"
  - "02-channel-coverage.png"
support:
  url: "https://github.com/AgntUX/AUX-plugins/issues?q=label%3Aagntux-slack"
  email: "support@agntux.ai"
requires_plugins:
  - agntux-core
requires_source_mcp:
  source: connector
  connector_slug: slack
  display_name: "Slack"
developer:
  name: "AgntUX"
  url: "https://agntux.ai"
  github_handle: "agntux"
proposed_schema:
  entity_subtypes:
    - subtype: person
      description: "Slack users — DM partners, channel co-authors, mentioned colleagues. Email from profile is the cross-source alias."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
    - subtype: company
      description: "Organizations referenced in Slack — vendors, customers, partners surfaced via shared links or named in messages."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
    - subtype: project
      description: "Workstreams or codenames mentioned in channels and threads (often resolved via user.md → # Glossary)."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
    - subtype: topic
      description: "Recurring themes, products, or initiatives surfaced across multiple Slack threads."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
  action_classes:
    - class: deadline
      description: "A Slack message carrying an explicit due date or time-bound ask."
    - class: response-needed
      description: "A DM, @mention, vote/poll, or thread reply that expects a response from the user."
    - class: knowledge-update
      description: "An informational signal extracted from a Slack thread (decision, status update, pinned message)."
    - class: risk
      description: "Outage/incident/security signal in a monitored ops or security channel; @here / @channel pings to high-stakes channels."
    - class: opportunity
      description: "Competitor or market signal in a sales/marketing channel; prospect activity or partnership cues."
    - class: other
      description: "Escape hatch for items that don't fit the above; requires reason_detail."
  cursor_semantics: "Single JSON map (one line) under `cursor`. Two key shapes: `<channel_id>` for channel cursors (newest parent ts), `<channel_id>#<thread_ts>` for thread cursors (newest reply ts)."
  source_id_format: "`<channel_id>#<thread_ts>` for thread-rooted artefacts; `<channel_id>#<ts>` for non-threaded messages."
