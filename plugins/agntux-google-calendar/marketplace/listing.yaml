# Marketplace lint hard-fails any string field over its cap (E05) and any
# category outside the closed enum (E04). Caps: tagline ≤80, description
# ≤500, ui_components[].title ≤60, ui_components[].purpose ≤200,
# proposed_schema.{entity_subtypes,action_classes}[].description ≤200,
# cursor_semantics ≤200, source_id_format ≤120. Categories (pick 1–3):
# productivity, communication, crm, project-management, developer-tools,
# analytics, notes-knowledge, scheduling, calendar (meta is agntux-core only).
# Write for non-technical users: lead with the benefit, keep it short, and
# avoid jargon (ingest, cursor, MCP, schema, entities, knowledge store,
# $ARGUMENTS). The caps are ceilings, not targets — shorter is better.
tagline: "A daily look at your week ahead, with everything you need to prepare."
description: |
  Brings your Google Calendar into AgntUX. Each morning it reads the week
  ahead and, for every meeting, pulls together what you need to prepare —
  related Slack threads, emails, and past notes — right where you'll see it.
  When you want to act, two buttons let you find a time and schedule a
  meeting, or accept, tentatively accept, or decline an invite.
categories:
  - productivity
  - communication
keywords:
  - google-calendar
  - gcal
  - calendar
  - meetings
  - meeting
  - schedule
  - prep
  - agenda
  - invites
  - rsvp
available_on:
  - trial
  - pro
  - team
  - enterprise
data_ingested:
  - Upcoming events on all your calendars over the next 7 days
  - "Each event's attendees, location, description, video link, and organizer"
  - Times where two events overlap
supported_prompts:
  - prompt: "/agntux-google-calendar"
    purpose: "Type `/agntux-google-calendar` to check your upcoming calendar now. Or ask a question about your schedule — it just looks things up."
ui_components:
  - name: schedule
    title: "Find a time and schedule the meeting"
    purpose: "Pick who to invite and a rough window; AgntUX shows the open slots. Choose one and Send creates the meeting with your prep notes attached."
    view_tool: agntux_google_calendar_schedule_view
    resource_uri: "ui://agntux-google-calendar/schedule"
  - name: respond
    title: "Accept, tentatively accept, or decline the invite"
    purpose: "See the invite with any conflicts and your prep notes. Accept, tentatively accept, or decline — with an optional note to the organizer."
    view_tool: agntux_google_calendar_respond_view
    resource_uri: "ui://agntux-google-calendar/respond"
screenshot_order: []
support:
  url: "https://github.com/AgntUX/AUX-plugins/issues?q=label%3Aagntux-google-calendar"
  email: "support@agntux.ai"
developer:
  name: "AgntUX"
  url: "https://agntux.ai"
  github_handle: "agntux"
requires_plugins:
  - agntux-core
requires_source_mcp:
  source: connector
  connector_slug: google-calendar
  display_name: "Google Calendar"
proposed_schema:
  entity_subtypes:
    - subtype: person
      description: "People invited to your events, matched up by email address."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
    - subtype: company
      description: "Resolved from email domains in attendee lists."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
    - subtype: project
      description: "Project names found in event titles and descriptions."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
    - subtype: topic
      description: "Recurring meeting themes — standups, weekly syncs, customer reviews."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
  action_classes:
    - class: deadline
      description: "An event with hard prep work due before start; e.g. review deck, submit Q3 numbers."
    - class: response-needed
      description: "An invite the user has not yet responded to."
    - class: meeting-prep
      description: "An upcoming meeting the user is attending needs prep context surfaced before start."
    - class: risk
      description: "Conflict, double-booking, or critical-meeting overlap."
    - class: knowledge-update
      description: "A recurring meeting whose summary or outcome should be captured post-event."
    - class: other
      description: "Escape hatch for calendar events not fitting the above classes."
  cursor_semantics: "JSON map with `look_ahead_window_end` (RFC3339) and per-event `<calendar_id>#<event_id>` → `updated` timestamp pairs. Past events evict on each sync pass."
  source_id_format: "`<calendar_id>#<event_id>` for events; add `#<occurrence_start>` for recurring event instances."
