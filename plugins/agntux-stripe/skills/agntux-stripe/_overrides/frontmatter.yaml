# _overrides/frontmatter.yaml — agntux-stripe
#
# Substitution map consumed by scripts/render-skill.mjs.
# Every {{key}} in the canonical sync template must appear here;
# the renderer's surviving-placeholder guard fails the build otherwise.

plugin-slug: agntux-stripe
plugin-version: 0.1.0                       # matches .claude-plugin/plugin.json

source-display-name: Stripe
source-slug: stripe

# Matches plugin.json recommended_ingest_cadence exactly.
recommended-cadence: "Every 60 min, 7am–7pm weekdays local"

# Cursor semantics (dual-mode, capability-detected):
# Mode A — Single scalar low-water-mark (Events API available): cursor is the
# ISO-8601 UTC timestamp of the newest Stripe Event processed in the last
# successful run. Incremental filter: convert cursor to Unix epoch and pass as
# created[gt] to the Events API (stripe_api_read on the events list operation).
# Advance cursor to max(event.created) across all events successfully processed
# this run; advance only on full-run success (transactional rule). Never regress.
#
# Mode B — Per-resource timestamp map (Events API unavailable): cursor is a
# YAML mapping of resource-family names to ISO-8601 UTC timestamps, each
# advancing independently via search_stripe_resources or stripe_api_read with
# created[gt] per family. Advance each family key to max(item.created) for
# items of that family successfully processed this run. Same transactional rule
# and non-regression constraint apply per key.
#
# Mode is capability-detected at Step 5a (stripe_api_search probe); cursor
# format switches transparently between modes. validate-cursor.mjs accepts
# either a plain ISO-8601 string (Mode A) or a YAML mapping (Mode B).
source-cursor-semantics: "Capability-detected dual-mode: (A) single scalar ISO-8601 UTC low-water-mark when Events API is available — advance to max(event.created) across all events successfully processed, convert to Unix epoch for created[gt] filter; (B) per-resource timestamp map when Events API is unavailable — one ISO-8601 UTC timestamp per resource family advancing independently via search_stripe_resources or stripe_api_read created[gt]. Both modes: advance only on full-run success (transactional rule), never regress the cursor."

# Stripe MCP tool root names (host UUID-prefixes these at runtime as
# mcp__8e4b8d3c-987a-4d48-a040-55e9abaf4aed__<tool>; call by host-resolved name).
# Primary tools used by the ingest fetch step:
#   search_stripe_resources   — query across customers, payment_intents, charges,
#                               invoices, prices, products, subscriptions by
#                               created>TIMESTAMP and status filters. Primary
#                               tool for per-resource map mode (Events API unavailable).
#   fetch_stripe_resources    — get one object by id (pi_, ch_, in_, price_,
#                               prod_, sub_, cus_).
#   stripe_api_read           — generic GET on any Stripe API operation_id;
#                               used for Events API (primary change feed when
#                               available), and for disputes, refunds, coupons,
#                               promotion_codes, payment_links, payouts,
#                               payment_method_configurations in both modes.
#   stripe_api_search         — discover operation_ids and accepted parameters
#                               before calling stripe_api_read; also used to
#                               probe Events API availability at Step 5a.
#   stripe_api_details        — fetch detailed schema / field descriptions for
#                               a discovered operation_id.
source-mcp-tools: "search_stripe_resources, fetch_stripe_resources, stripe_api_read, stripe_api_search, stripe_api_details"

# Each Stripe Event is the atomic unit of change surfaced per run.
thread-unit-name: event

bootstrap-window-default-days: "30"

# One representative Stripe resource type used in the SKILL description.
example-channel: payment

# No user-initiated view lane for the initial release (ingest-only;
# actions resolve to "Open in Stripe" deep links — no compose/send flow).
extra-skill-triggers: ""

# Documentation-only declarations (NOT {{...}} placeholders — the renderer's
# scalar-only parser skips list bodies; these are read by invariant-checker
# §4.4 / lint sub-check 11 and referenced in prose by the canonical
# runbook.md as the source of truth for valid `errors: kind:` values).
permitted-error-kinds:
  # Generic kinds (canonical — every ingest plugin carries these verbatim):
  - auth
  - network
  - parse
  - source
  - internal
  - lock-acquire-race
  - lock-acquire-failed
  - out-of-lane-write-attempted
  - contract-version-drift
  - contract-not-registered
  - contract-minor-out-of-date
  - bootstrap_window_days-out-of-range
  - usermd-malformed
  - subtype-out-of-contract
  # Source-prefixed extensions for Stripe:
  - stripe-cursor-evicted       # cursor JSON malformed or irrecoverably stale; treated as bootstrap
  - stripe-rate-limited         # Stripe API returned 429 / rate-limit signal; fetch aborted for this run
  - stripe-event-type-unknown   # event.type is not in the recognised family set; skipped, not an error per se but logged when count is high
  - stripe-object-not-found     # fetch_stripe_resources or stripe_api_read returned 404 for a known id; entity skipped
  - stripe-pagination-overflow  # events/items page cap exceeded; remainder deferred to next run
  - stripe-events-api-unavailable  # Events API operation not found or not available; per-resource map mode activated
