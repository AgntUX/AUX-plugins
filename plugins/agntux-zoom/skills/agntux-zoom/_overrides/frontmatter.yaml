# _overrides/frontmatter.yaml — agntux-zoom
#
# Substitution map consumed by scripts/render-skill.mjs.
# Every {{key}} in the canonical sync template must appear here;
# the renderer's surviving-placeholder guard fails the build otherwise.

plugin-slug: agntux-zoom
plugin-version: 0.2.0                      # matches .claude-plugin/plugin.json
source-display-name: Zoom
source-slug: zoom

# Matches plugin.json recommended_ingest_cadence exactly.
recommended-cadence: "Every 30 min, 7am–7pm weekdays local"

# Cursor semantics:
# Dual-key JSON cursor stored on the sync.md → cursor line.
#
#   meetings_since — ISO-8601 UTC low-water-mark for the meetings and
#     recordings fetch window. On each incremental run, set the fetch window
#     to [meetings_since, now]. Advance to now at the end of every successful
#     run. recordings_list enforces a max 1-month window per call; when the
#     window exceeds 31 days (bootstrap or a long gap), chunk into
#     consecutive 31-day sub-windows and union the results.
#
#   chat_since — ISO-8601 UTC low-water-mark for the search_zoom Team Chat
#     fetch. Passed as the `from` parameter to search_zoom calls. Advance to
#     now at the end of every successful run.
#
# Both keys advance to the run's `now` timestamp only when every action write
# this run has succeeded (transactional rule). Never regress either key.
#
# Cursor shape in sync.md frontmatter:
#   cursor: '{"meetings_since":"2026-06-25T10:00:00Z","chat_since":"2026-06-25T10:00:00Z"}'
#
# Bootstrap (cursor null): set meetings_since to now − bootstrap_window_days,
# chat_since to now − bootstrap_window_days. Chunk recordings_list into
# consecutive 31-day windows across the bootstrap span.
#
# Eviction: if a meeting_uuid in the asset-fetch queue returns 404 from
# get_meeting_assets, log zoom-meeting-not-found and continue. If the
# recordings_list from/to window is rejected by the connector (window > 31
# days), log zoom-recordings-window-exceeded and split into sub-windows.
source-cursor-semantics: "Dual-key JSON cursor: (1) meetings_since — ISO-8601 UTC low-water-mark; set fetch window to [meetings_since, now] for search_meetings and recordings_list (chunk recordings_list into ≤31-day sub-windows when the gap exceeds 31 days; bootstrap_window_days default 30 days); (2) chat_since — ISO-8601 UTC low-water-mark passed as the `from` filter to search_zoom for Team Chat and Docs. Both keys advance to the run's `now` timestamp only on full-run success (transactional rule). Bootstrap (cursor null): both keys start at now − bootstrap_window_days."

# Tool names as the host exposes them (UUID-prefixed by Cowork at runtime).
# Read-only tools used for ingest:
#   search_meetings — search/list meetings by topic/content/date; requires
#     user timezone before calling; returns meeting_uuid, meeting_number,
#     topic, schedule_start_time, meeting_status (HISTORY/SCHEDULED), host,
#     duration, timezone. Prefer meeting_uuid for downstream calls.
#   recordings_list — list cloud recordings in a date window (max 1-month
#     range, from/to yyyy-mm-dd); paginate via next_page_token.
#   get_meeting_assets — given meetingId (prefer UUID, must be double-encoded),
#     returns meeting_summary (AI quick recap + full text + next steps),
#     my_notes, recording, whiteboards, docs, agenda_doc, participants.
#     Returns 403 if not host/granted; 404 if bad id.
#   get_recording_resource — given meetingId, returns transcripts (timeline of
#     {text, ts, end_ts, display_name}), summaries (overall_summary + items),
#     next_steps (items[].text), play_urls. Pass types=transcript,summary,
#     nextStep,playUrl.
#   search_zoom — keyword/semantic search across Team Chat messages and Zoom
#     Docs. search_entities array with entity_type chat|zoom_doc and filters
#     (channel_names, from/to ISO-8601 UTC, unread, doc_view).
#   get_file_content — given fileId, returns a Doc/Notes file's markdown
#     content.
source-mcp-tools: "search_meetings, recordings_list, get_meeting_assets, get_recording_resource, search_zoom, get_file_content"

# A completed meeting and its assets (summary, transcript, next steps) form
# the atomic ingest unit. Each meeting is the thread unit for action-item
# grouping; a Team Chat channel or Doc is secondary surface.
thread-unit-name: meeting

bootstrap-window-default-days: "30"

# One representative Zoom scope name for SKILL description trigger phrases.
example-channel: team meeting

# No user-initiated compose/send lane for the initial release (ingest + triage
# only; actions resolve to "Open in Zoom" recording/meeting deep links).
extra-skill-triggers: ""

# Documentation-only declarations (NOT {{...}} placeholders — the renderer's
# scalar-only parser skips list bodies; these are read by invariant-checker
# §4.4 / lint sub-check 11 and referenced in prose by the canonical
# runbook.md as the source of truth for valid `errors: kind:` values).
permitted-error-kinds:
  # Generic kinds (canonical — every ingest plugin carries these verbatim):
  - auth
  - network
  - parse
  - source
  - internal
  - lock-acquire-race
  - lock-acquire-failed
  - out-of-lane-write-attempted
  - contract-version-drift
  - contract-not-registered
  - contract-minor-out-of-date
  - bootstrap_window_days-out-of-range
  - usermd-malformed
  - subtype-out-of-contract
  # Source-prefixed extensions for Zoom — derived from the connector's
  # read-tool error paths and the dual-key cursor strategy above:
  - zoom-cursor-evicted             # meeting_uuid previously tracked is no longer reachable; evicted from processing queue
  - zoom-cursor-malformed           # cursor JSON present but not parseable; fall back to bootstrap window
  - zoom-meeting-not-found          # get_meeting_assets returned 404 for a known meeting_uuid; meeting skipped
  - zoom-meeting-access-denied      # get_meeting_assets returned 403 (not host/granted); meeting skipped
  - zoom-recording-not-found        # get_recording_resource returned 404 for a meetingId; recording skipped
  - zoom-recordings-window-exceeded # recordings_list window > 31 days without chunking; sub-window split applied
  - zoom-rate-limited               # connector returned 429; fetch aborted for this run
  - zoom-pagination-overflow        # per-run item cap reached; remainder deferred to next run
  - zoom-timezone-unresolved        # user timezone could not be resolved before search_meetings; run aborted
