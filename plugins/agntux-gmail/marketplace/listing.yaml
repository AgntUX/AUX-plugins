tagline: "See the emails that need a reply, and draft responses safely."
description: |
  Brings your Gmail into AgntUX. It spots the emails that need a reply —
  messages to you, threads you're waiting on, replies you owe — and drafts a
  response for you. It only ever saves to your Gmail Drafts; you review and
  hit Send in Gmail.
categories:
  - communication
  - productivity
keywords:
  - gmail
  - email
  - inbox
  - threads
  - action-items
available_on:
  - trial
  - pro
  - team
  - enterprise
data_ingested:
  - "Inbox threads where you are in to: or cc:"
  - "Threads where you have sent a message and someone has replied since"
  - "Your sent items awaiting reply for ≥3 days"
  - "Threads carrying the IMPORTANT Gmail label"
  - "Subject lines and short previews from related conversations, used to write better replies"
supported_prompts:
  - prompt: "/agntux-gmail"
    purpose: "Type `/agntux-gmail` to check for new email now. Or ask a question about your inbox — that just looks things up, it doesn't change anything."
ui_components:
  - name: "compose"
    title: "Gmail reply composer"
    purpose: "Write a reply right here — edit the recipients, subject, and body, with context from your past emails. Save puts it in your Gmail Drafts and opens it for you to review and send."
    view_tool: "agntux_gmail_compose_view"
    resource_uri: "ui://agntux-gmail/compose"
screenshot_order:
  - "00-sync-status.png"
  - "01-action-detail.png"
  - "02-compose-card.png"
support:
  url: "https://github.com/AgntUX/AUX-plugins/issues?q=label%3Aagntux-gmail"
  email: "support@agntux.ai"
requires_plugins:
  - agntux-core
requires_source_mcp:
  source: connector
  connector_slug: gmail
  display_name: "Gmail"
developer:
  name: "AgntUX"
  url: "https://agntux.ai"
  github_handle: "agntux"
proposed_schema:
  entity_subtypes:
    - subtype: person
      description: "Email correspondents — senders, recipients, cc'd colleagues. Email address is the canonical cross-source alias used to merge with people surfaced by Slack and other sources."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
    - subtype: company
      description: "Organisations resolved from sender email domains and signature blocks. Vendors, customers, partners surfaced via correspondence."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
    - subtype: project
      description: "Workstreams or codenames mentioned in email subjects and bodies (often resolved via user.md → # Glossary)."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
    - subtype: topic
      description: "Recurring themes or initiatives surfaced across multiple email threads."
      required_frontmatter:
        - id
        - type
        - schema_version
        - subtype
        - aliases
        - sources
        - created_at
        - updated_at
        - last_active
        - deleted_upstream
  action_classes:
    - class: deadline
      description: "An email carrying an explicit due date or time-bound ask."
    - class: response-needed
      description: "An email addressed to the user (to: or cc:) or a thread where someone has replied since the user's last message and a reply is expected."
    - class: knowledge-update
      description: "An informational signal extracted from an email thread (decision summary, status update, important announcement)."
    - class: risk
      description: "Outage, incident, security, or escalation signals that warrant urgent attention."
    - class: opportunity
      description: "Sales, partnership, or market signal in an email thread."
    - class: other
      description: "Escape hatch for items that don't fit the above; requires reason_detail."
  cursor_semantics: "Single JSON map (one line). Two key shapes: `inbox` for the discovery low-water-mark (Gmail epoch-seconds); `<thread_id>` for per-thread cursors (newest message internalDate processed)."
  source_id_format: "`<thread_id>` for thread-rooted artefacts; `<thread_id>#<message_id>` for per-message artefacts when needed."
