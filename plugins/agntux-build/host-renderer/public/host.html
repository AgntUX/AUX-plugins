<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>agntux-build host</title>
    <style>
      :root {
        color-scheme: light;
        --aux-bg: #ffffff;
        --aux-surface: #f7f7f8;
        --aux-fg: #1a1a1a;
        --aux-muted: #6b6b73;
        --aux-border: #e5e5ea;
        --aux-accent: #1f6feb;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--aux-bg);
        color: var(--aux-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      header {
        padding: 12px 16px;
        background: var(--aux-surface);
        border-bottom: 1px solid var(--aux-border);
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 13px;
      }
      header strong {
        color: var(--aux-fg);
      }
      header span {
        color: var(--aux-muted);
      }
      main {
        max-width: 600px;
        margin: 32px auto;
        padding: 0 16px;
      }
      .iframe-container {
        border: 1px solid var(--aux-border);
        border-radius: 12px;
        overflow: hidden;
        background: var(--aux-bg);
      }
      iframe.sandbox {
        width: 100%;
        min-height: 400px;
        max-height: 600px;
        border: 0;
        display: block;
        background: transparent;
      }
      .status {
        padding: 12px 16px;
        font-size: 13px;
        color: var(--aux-muted);
      }
      .status.error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>agntux-build host</strong>
      <span>•</span>
      <span id="status">loading</span>
    </header>
    <main>
      <div class="iframe-container">
        <iframe
          id="ui"
          class="sandbox"
          sandbox="allow-scripts allow-same-origin allow-forms"
        ></iframe>
      </div>
      <div class="status" id="diag"></div>
    </main>
    <script type="module" src="/host-bridge.mjs"></script>
  </body>
</html>
