<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>agntux-build host</title>
    <style>
      :root {
        color-scheme: light;
        --aux-bg: #ffffff;
        --aux-surface: #f7f7f8;
        --aux-fg: #1a1a1a;
        --aux-muted: #6b6b73;
        --aux-border: #e5e5ea;
        --aux-accent: #1f6feb;
        --aux-error: #b00020;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--aux-bg);
        color: var(--aux-fg);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
          sans-serif;
        font-size: 14px;
        line-height: 1.5;
      }
      header {
        padding: 12px 16px;
        background: var(--aux-surface);
        border-bottom: 1px solid var(--aux-border);
        display: flex;
        gap: 12px;
        align-items: center;
        font-size: 13px;
      }
      header strong {
        color: var(--aux-fg);
      }
      header span {
        color: var(--aux-muted);
      }
      .layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 16px;
        max-width: 1100px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .iframe-container {
        border: 1px solid var(--aux-border);
        border-radius: 12px;
        overflow: hidden;
        background: var(--aux-bg);
      }
      iframe.sandbox {
        width: 100%;
        min-height: 400px;
        max-height: 600px;
        border: 0;
        display: block;
        background: transparent;
      }
      .status {
        padding: 12px 16px;
        font-size: 13px;
        color: var(--aux-muted);
      }
      .status.error {
        color: var(--aux-error);
      }
      aside.intercepts {
        border: 1px solid var(--aux-border);
        border-radius: 12px;
        overflow: hidden;
        background: var(--aux-surface);
        display: flex;
        flex-direction: column;
        max-height: 700px;
      }
      aside.intercepts header.panel {
        padding: 10px 14px;
        background: var(--aux-bg);
        border-bottom: 1px solid var(--aux-border);
        font-weight: 600;
        font-size: 13px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      aside.intercepts header.panel small {
        color: var(--aux-muted);
        font-weight: 400;
      }
      aside.intercepts .intercept-list {
        overflow-y: auto;
        padding: 8px;
      }
      aside.intercepts .empty {
        padding: 18px 14px;
        color: var(--aux-muted);
        font-size: 12px;
        line-height: 1.6;
      }
      .intercept-item {
        padding: 8px 10px;
        margin-bottom: 8px;
        background: var(--aux-bg);
        border: 1px solid var(--aux-border);
        border-radius: 8px;
        font-size: 12px;
      }
      .intercept-item .tool {
        font-weight: 600;
        color: var(--aux-accent);
      }
      .intercept-item .ts {
        color: var(--aux-muted);
        font-size: 11px;
        margin-left: 8px;
      }
      .intercept-item pre {
        margin: 6px 0 0;
        padding: 6px 8px;
        background: var(--aux-surface);
        border-radius: 6px;
        font-size: 11px;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow-y: auto;
      }
    </style>
  </head>
  <body>
    <header>
      <strong>agntux-build host</strong>
      <span>•</span>
      <span id="status">loading</span>
    </header>
    <div class="layout">
      <main>
        <div class="iframe-container">
          <iframe
            id="ui"
            class="sandbox"
            sandbox="allow-scripts allow-same-origin allow-forms"
          ></iframe>
        </div>
        <div class="status" id="diag"></div>
      </main>
      <aside class="intercepts" aria-label="Intercepted mutation tool calls">
        <header class="panel">
          <span>Intercepted calls</span>
          <small id="intercept-count">0</small>
        </header>
        <div class="intercept-list" id="intercept-list">
          <div class="empty" id="intercept-empty">
            Mutation tool calls fired from inside the iframe land here.
            Click Send / Schedule / Create in the iframe to see the
            payload your plugin will hand the connector — but nothing
            will be sent to a real connector.
          </div>
        </div>
      </aside>
    </div>
    <script type="module" src="/host-bridge.mjs"></script>
    <script>
      // Subscribe to the SSE intercept stream so the sidebar updates live.
      // The server-side stream subscribes BEFORE replaying its ring buffer,
      // so an entry that arrives during the replay window can be delivered
      // twice (once via snapshot, once via live push). Dedupe by `ts +
      // tool` so the sidebar never shows the same call twice.
      (function () {
        const listEl = document.getElementById("intercept-list");
        const emptyEl = document.getElementById("intercept-empty");
        const countEl = document.getElementById("intercept-count");
        const seen = new Set();
        let count = 0;
        const source = new EventSource("/api/intercepts/stream");
        source.addEventListener("intercept", (ev) => {
          let entry;
          try {
            entry = JSON.parse(ev.data);
          } catch {
            return;
          }
          const key = `${entry.ts}|${entry.tool}`;
          if (seen.has(key)) return;
          seen.add(key);
          if (emptyEl && emptyEl.parentNode) emptyEl.parentNode.removeChild(emptyEl);
          count += 1;
          countEl.textContent = String(count);
          const item = document.createElement("div");
          item.className = "intercept-item";
          const head = document.createElement("div");
          const tool = document.createElement("span");
          tool.className = "tool";
          tool.textContent = entry.tool;
          const ts = document.createElement("span");
          ts.className = "ts";
          ts.textContent = entry.ts;
          head.appendChild(tool);
          head.appendChild(ts);
          item.appendChild(head);
          const pre = document.createElement("pre");
          pre.textContent = JSON.stringify(entry.args, null, 2);
          item.appendChild(pre);
          listEl.insertBefore(item, listEl.firstChild);
        });
        source.onerror = () => {
          // ignore; auto-reconnect is built into EventSource
        };
      })();
    </script>
  </body>
</html>
