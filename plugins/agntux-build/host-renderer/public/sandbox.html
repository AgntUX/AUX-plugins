<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <!--
      CSP is set via HTTP headers by server.mjs based on the ?csp= query
      param. The inner iframe inherits this CSP via document.write().
      Lifted from modelcontextprotocol/ext-apps/examples/basic-host
      sandbox.html (MIT) — see ../NOTICE.
    -->
    <title>agntux-build sandbox proxy</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100vh;
        width: 100vw;
        background-color: transparent;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      * {
        box-sizing: border-box;
      }
      iframe {
        background-color: transparent;
        border: 0;
        padding: 0;
        overflow: hidden;
        flex-grow: 1;
        color-scheme: inherit;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <script>
      // Minimal sandbox proxy: receive the inner-iframe HTML from the
      // outer host (window.parent), document.write it into a new
      // child iframe so it inherits this document's CSP.
      //
      // Bidirectional pipe between the parent host (which runs the
      // canonical AppBridge from @modelcontextprotocol/ext-apps) and
      // the inner React iframe. All messages are JSON-RPC envelopes —
      // canonical PostMessageTransport silently drops anything that
      // doesn't `JSONRPCMessageSchema.safeParse`, so the ready
      // notification below carries `jsonrpc: "2.0"`.
      (function () {
        const READY_METHOD = "ui/notifications/sandbox-proxy-ready";
        const RESOURCE_METHOD = "ui/notifications/sandbox-resource-ready";
        let inner = null;
        function ensureInnerIframe(sandboxAttr) {
          if (inner) return inner;
          inner = document.createElement("iframe");
          inner.setAttribute(
            "sandbox",
            sandboxAttr || "allow-scripts allow-same-origin allow-forms",
          );
          document.body.appendChild(inner);
          return inner;
        }
        window.addEventListener("message", (event) => {
          const isFromParent = event.source === window.parent;
          const isFromInner = inner && event.source === inner.contentWindow;
          if (isFromParent) {
            const data = event.data;
            if (!data || typeof data !== "object") return;
            if (data.method === RESOURCE_METHOD && data.params?.html) {
              const ifr = ensureInnerIframe(data.params.sandbox);
              const doc = ifr.contentDocument;
              doc.open();
              doc.write(data.params.html);
              doc.close();
              return;
            }
            if (inner && inner.contentWindow) {
              inner.contentWindow.postMessage(data, "*");
            }
            return;
          }
          // Messages from the inner iframe: bubble up to the parent host.
          if (isFromInner) {
            window.parent.postMessage(event.data, "*");
          }
        });
        // Tell the host we're ready to receive sandbox-resource-ready.
        // - `jsonrpc: "2.0"` is required — the canonical PostMessageTransport
        //   silently drops anything that fails JSONRPCMessageSchema.safeParse.
        // - `params: {}` is required — AppBridge's `sandboxready` event Zod
        //   schema declares params as a (possibly empty) object literal, not
        //   optional. Notifications without a params field are dropped.
        window.parent.postMessage(
          { jsonrpc: "2.0", method: READY_METHOD, params: {} },
          "*",
        );
      })();
    </script>
  </body>
</html>
