tagline: "Build a new AgntUX plugin for a tool AgntUX doesn't support yet."
description: |
  Step-by-step help to add a tool AgntUX doesn't support yet. You'll pick
  the tool, design a simple action button, preview it, and test it against
  your real data. Built for everyone, not just engineers — plain language,
  a clean standard look, and a little encouragement at each step. Expect to
  test it a few times until it feels right; that's completely normal.
categories:
  - meta
  - developer-tools
keywords:
  - plugin
  - build
  - contribute
  - extend
  - marketplace
available_on:
  - trial
  - pro
  - team
  - enterprise
supported_prompts:
  - prompt: "/agntux-build:build"
    purpose: "Walks you through building a plugin for a tool AgntUX doesn't support yet. Can also fix an existing plugin if you've run into something specific."
