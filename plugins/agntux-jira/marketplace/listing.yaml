# Marketplace lint hard-fails any string field over its cap (E05) and any
# category outside the closed enum (E04). Caps: tagline ≤80, description
# ≤500, ui_components[].title ≤60, ui_components[].purpose ≤200,
# proposed_schema.{entity_subtypes,action_classes}[].description ≤200,
# cursor_semantics ≤200, source_id_format ≤120. Categories (pick 1–3):
# productivity, communication, crm, project-management, developer-tools,
# analytics, notes-knowledge, scheduling, calendar (meta is agntux-core only).
# Write for non-technical users: lead with the benefit, keep it short, and
# avoid jargon (ingest, cursor, MCP, schema, entities, knowledge store,
# $ARGUMENTS). The caps are ceilings, not targets — shorter is better.
tagline: "See your Jira issues and act on them without leaving your workflow."
description: |
  Brings your Jira issues into AgntUX so the work that needs you shows up in one place. See assignments, replies on watched issues, and work that's stalling — then comment, transition, assign, edit, or log time directly from AgntUX.
categories:
  - project-management
  - developer-tools
keywords:
  - jira
  - issues
  - atlassian
  - project-management
  - agile
available_on:
  - trial
  - pro
  - team
  - enterprise
requires_plugins:
  - agntux-core
requires_source_mcp:
  source: connector
  connector_slug: jira
  display_name: "Jira Cloud"
supported_prompts:
  - prompt: "/agntux-jira"
    purpose: "Type `/agntux-jira` to check for new Jira issues and updates now. Or ask a question about your Jira — it just looks things up."
ui_components:
  - name: comment-issue
    title: "Comment on issue"
    purpose: "Add a comment to a Jira issue."
    view_tool: agntux_jira_comment_view
    resource_uri: "ui://agntux-jira/comment"
  - name: transition-issue
    title: "Transition issue"
    purpose: "Change an issue's status (e.g., In Progress to In Review)."
    view_tool: agntux_jira_transition_view
    resource_uri: "ui://agntux-jira/transition"
  - name: assign-issue
    title: "Assign issue"
    purpose: "Assign an issue to a person or team."
    view_tool: agntux_jira_assign_view
    resource_uri: "ui://agntux-jira/assign"
  - name: edit-issue-fields
    title: "Edit issue details"
    purpose: "Update priority, labels, summary, or other issue fields."
    view_tool: agntux_jira_edit_view
    resource_uri: "ui://agntux-jira/edit"
  - name: log-work-time
    title: "Log time"
    purpose: "Record work hours spent on an issue."
    view_tool: agntux_jira_log_work_view
    resource_uri: "ui://agntux-jira/log-work"
support:
  url: "https://github.com/AgntUX/AUX-plugins/issues"
  email: "support@agntux.ai"
developer:
  name: "AgntUX"
  url: "https://agntux.ai"
  github_handle: "agntux"
proposed_schema:
  entity_subtypes:
    - subtype: issue
      description: "A Jira issue or task that appears in a project."
    - subtype: comment
      description: "A comment left on a Jira issue."
    - subtype: transition
      description: "A workflow state change available for an issue."
    - subtype: worklog
      description: "A time entry logged against an issue."
  action_classes:
    - class: response-needed
      description: "An issue is waiting for a reply or action from the user."
    - class: needs-decision
      description: "An issue requires a decision or state change as an SLA approaches."
    - class: knowledge-update
      description: "A status update or new information on a watched issue."
  cursor_semantics: "Per-project cursor map keyed by projectKey; value is the most-recent issue updated timestamp in ISO8601 format."
  source_id_format: "`jira:{cloudId}:issue:{issueKey}` for issues; `jira:{cloudId}:issue:{issueKey}:comment:{commentId}` for comments."
