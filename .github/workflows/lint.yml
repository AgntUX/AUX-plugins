name: Lint marketplace metadata

on:
  push:
    paths:
      - "plugins/**"
      - "canonical/**"
      - "scripts/lint-marketplace-metadata.ts"
      - "lib/marketplace-schema.ts"
  pull_request:
    paths:
      - "plugins/**"
      - "canonical/**"
      - "scripts/lint-marketplace-metadata.ts"
      - "lib/marketplace-schema.ts"
  workflow_call:

jobs:
  lint:
    name: Lint + version-changelog check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        # actions/checkout v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        # actions/setup-node v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run marketplace metadata linter
        run: npm run lint:marketplace

      - name: Run version-changelog check
        run: npx tsx scripts/verify-version-changelog.ts
