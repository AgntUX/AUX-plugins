name: Version check

on:
  pull_request:
    paths:
      - "plugins/**"
  workflow_call:

jobs:
  version-check:
    name: plugin.json version matches CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        # actions/checkout v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        # actions/setup-node v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify version / CHANGELOG alignment
        run: npx tsx scripts/verify-version-changelog.ts
