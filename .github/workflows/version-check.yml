name: Version check

on:
  pull_request:
    paths:
      - "plugins/**"
  workflow_call:

jobs:
  version-check:
    name: plugin.json version matches CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        # actions/checkout v7.0.0
        with:
          # Full history so scripts/affected.mjs can diff to scope the check.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        # actions/setup-node v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute affected plugins
        id: affected
        env:
          # Explicit event SHAs so affected.mjs diffs against the TRUE base without
          # depending on origin/<base> being fetched: PR → the base commit SHA;
          # push → the pre-push SHA (covers every commit in a multi-commit push).
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          {
            echo "mode=$(node scripts/affected.mjs mode)"
            echo "plugins=$(node scripts/affected.mjs plugins)"
          } >> "$GITHUB_OUTPUT"

      - name: Verify version / CHANGELOG alignment (full)
        if: steps.affected.outputs.mode == 'full'
        run: npx tsx scripts/verify-version-changelog.ts

      - name: Verify version / CHANGELOG alignment (scoped to affected plugins)
        if: steps.affected.outputs.mode == 'scoped' && steps.affected.outputs.plugins != ''
        env:
          AFFECTED: ${{ steps.affected.outputs.plugins }}
        run: |
          set -euo pipefail
          for s in $AFFECTED; do
            npx tsx scripts/verify-version-changelog.ts --plugin "$s"
          done
