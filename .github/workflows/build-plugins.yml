name: Build plugin artifacts

# On push to main, build every plugin's UI handler components, build each
# plugin's mcp-server (which embeds the components), and commit the resulting
# `dist/` and `out/` artifacts back to main with `[skip ci]`.
#
# This is the mechanism that makes `/plugin install` work end-to-end. The
# host's install model clones the repo and launches mcp-server/dist/index.js
# directly — it does NOT run `npm install` or any build step on the user's
# machine. So the artifacts must already be in the repo at the SHA the host
# fetches.
#
# Mirrors the auto-commit pattern in regenerate-indexes.yml. Skips the commit
# step when nothing changed so re-runs on the same SHA are a no-op.

on:
  push:
    branches:
      - main
    paths:
      - "plugins/**"
      - "packages/agntux-ui-primitives/**"
      - "scripts/build-plugin.mjs"
      - ".github/workflows/build-plugins.yml"

jobs:
  build-and-commit:
    name: Build plugin artifacts and commit back to main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        # actions/checkout v7.0.0
        with:
          # Fetch full history so we can push back to main.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        # actions/setup-node v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      - name: Build every plugin (components → mcp-server → bundle-sync)
        run: node scripts/build-plugin.mjs --all

      - name: Commit regenerated build artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Per-plugin-kind commit set (P7). The predicate is the same one
          # used by scripts/build-plugin.mjs and
          # scripts/regenerate-marketplace-json.ts: presence of mcp-server/.
          #
          # - Local-server plugins (mcp-server/) commit mcp-server/dist/
          #   plus any ui-handlers/*/component/out/ that feeds the embed.
          # - Source plugins (no mcp-server/, must have view-tool/) commit
          #   view-tool/dist/<slug>-view.js, view-tools.manifest.json, and
          #   ui-resources/*.html.
          # - agntux-core ships both, so its job stages both sets.
          #
          # Each `git add` is wrapped so a missing path (e.g. a plugin with
          # no ui-handlers/) does not abort the loop; .gitignore still
          # filters non-tracked files within each path.
          for plugin_dir in plugins/*/; do
            slug="$(basename "$plugin_dir")"
            if [ -d "${plugin_dir}mcp-server" ]; then
              echo "[$slug] local-server kind — staging mcp-server/dist + ui-handlers component out"
              git add "${plugin_dir}mcp-server/dist" 2>/dev/null || true
              git add "${plugin_dir}ui-handlers" 2>/dev/null || true
            fi
            if [ -d "${plugin_dir}view-tool" ]; then
              echo "[$slug] source/hybrid kind — staging view-tool/dist"
              git add "${plugin_dir}view-tool/dist" 2>/dev/null || true
            fi
          done
          git add packages 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No build artifact changes to commit."
          else
            git commit -m "chore: rebuild plugin artifacts [skip ci]"
            git push origin main
          fi

      - name: Tag new plugin versions
        # Push a `${slug}@${plugin.json.version}` tag for any plugin whose
        # current version doesn't yet have one. The remote MCP server's
        # pin-resolver (`lib/teams/pin-resolver.ts`) expects exactly this
        # tag shape, so this is the canonical "publish" event for a
        # plugin version. Idempotent: existing tags are never modified,
        # and re-runs on the same SHA after the version has already been
        # tagged are no-ops.
        #
        # Runs after the artifact-commit step so tags point at the SHA
        # that includes the freshly-built `dist/` outputs the host fetches.
        run: |
          git fetch --tags --quiet origin
          new_tags=()
          for plugin_dir in plugins/*/; do
            slug="$(basename "$plugin_dir")"
            manifest="${plugin_dir}.claude-plugin/plugin.json"
            if [ ! -f "$manifest" ]; then
              echo "[$slug] no .claude-plugin/plugin.json — skipping"
              continue
            fi
            version="$(node -p "require('./$manifest').version || ''" 2>/dev/null)"
            if [ -z "$version" ]; then
              echo "[$slug] plugin.json has no version field — skipping"
              continue
            fi
            tag="${slug}@${version}"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "[$slug] tag ${tag} already exists — skipping"
              continue
            fi
            echo "[$slug] tagging HEAD as ${tag}"
            git tag "${tag}" HEAD
            new_tags+=("refs/tags/${tag}")
          done
          if [ "${#new_tags[@]}" -gt 0 ]; then
            git push origin "${new_tags[@]}"
          else
            echo "No new version tags to push."
          fi
