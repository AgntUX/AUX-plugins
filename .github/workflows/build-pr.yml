name: Build verification

# Reusable workflow called from ci.yml on push and pull_request. Runs the
# same `build-plugin.mjs --all` orchestration that the post-merge
# build-plugins.yml workflow runs — but DO NOT commit. The job's purpose
# is twofold:
#
#   1. Fail the PR if a contributor edited a UI handler component or
#      mcp-server source but the resulting build is broken (typecheck error,
#      missing export, etc.).
#   2. Fail the PR via `check:bundle-sync` if the contributor edited a
#      component but didn't rebuild — which would otherwise leave a stale
#      base64 embed inside mcp-server/dist/index.js for reviewers to miss.
#
# This keeps the auto-commit on the post-merge workflow lightweight: by the
# time `build-plugins.yml` runs, the bundles are already in sync, so the
# auto-commit usually finds nothing to commit and exits cleanly.

on:
  workflow_call:

jobs:
  verify-build:
    name: Verify every plugin builds + bundle is in sync
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        # actions/checkout v7.0.0
        with:
          # Full history so scripts/affected.mjs can diff to scope the build.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        # actions/setup-node v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install root dependencies
        run: npm ci

      # Scope the build to the changed plugin(s); a shared-root change → build all
      # (it can change any plugin's bundle). An unaffected plugin's bundle cannot
      # have gone stale from this PR, so there is nothing to verify for it.
      - name: Compute affected plugins
        id: affected
        env:
          # Explicit event SHAs so affected.mjs diffs against the TRUE base without
          # depending on origin/<base> being fetched: PR → the base commit SHA;
          # push → the pre-push SHA (covers every commit in a multi-commit push).
          GITHUB_PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: |
          {
            echo "mode=$(node scripts/affected.mjs mode)"
            echo "plugins=$(node scripts/affected.mjs plugins)"
          } >> "$GITHUB_OUTPUT"

      - name: Build every plugin (full — shared change)
        if: steps.affected.outputs.mode == 'full'
        run: node scripts/build-plugin.mjs --all

      - name: Build affected plugins (components → mcp-server → bundle-sync)
        if: steps.affected.outputs.mode == 'scoped' && steps.affected.outputs.plugins != ''
        env:
          AFFECTED: ${{ steps.affected.outputs.plugins }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086 — AFFECTED is a charset-validated slug list.
          node scripts/build-plugin.mjs $AFFECTED
