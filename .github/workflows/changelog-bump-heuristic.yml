name: Changelog bump heuristic

on:
  pull_request:
    paths:
      - "plugins/*/CHANGELOG.md"
      - "plugins/*/.claude-plugin/plugin.json"
  workflow_call:

jobs:
  changelog-bump-heuristic:
    name: Bump-rule mismatch advisory check
    runs-on: ubuntu-latest
    # continue-on-error: this check is advisory; it never blocks a PR
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        # actions/checkout v6.0.3

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        # actions/setup-node v6.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run changelog bump heuristic (advisory — never fails CI)
        run: npx tsx scripts/changelog-bump-heuristic.ts
