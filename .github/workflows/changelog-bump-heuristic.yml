name: Changelog bump heuristic

on:
  pull_request:
    paths:
      - "plugins/*/CHANGELOG.md"
      - "plugins/*/.claude-plugin/plugin.json"
  workflow_call:

jobs:
  changelog-bump-heuristic:
    name: Bump-rule mismatch advisory check
    runs-on: ubuntu-latest
    # continue-on-error: this check is advisory; it never blocks a PR
    continue-on-error: true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        # actions/checkout v7.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        # actions/setup-node v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run changelog bump heuristic (advisory — never fails CI)
        run: npx tsx scripts/changelog-bump-heuristic.ts
